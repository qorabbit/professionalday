<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professionals Day Brisbane 2026 — 참석자 명단</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="professionals_day.css">
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="header-label">World Okta Brisbane</div>
    <div class="header-title">Professionals Day</div>
    <div class="header-sub">SAT 20 JUNE 2026 · 3PM · Longtime Dining, Queensplaza</div>
    <div class="header-stats">
      <div class="stat-pill"><span class="stat-dot dot-blue"></span>차세대 17명</div>
      <div class="stat-pill"><span class="stat-dot dot-amber"></span>회원 18명</div>
      <div class="stat-pill"><span class="stat-dot dot-red"></span>비회원 36명</div>
      <div class="stat-pill"><span class="stat-dot dot-purple"></span>강연자 3명</div>
      <div class="stat-pill"><span class="stat-dot dot-white"></span>총 74명</div>
    </div>
  </div>
</div>

<div class="main">
  <div class="controls">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search" placeholder="이름 검색..." oninput="render()">
    </div>
    <select id="catFilter" onchange="render()">
      <option value="">전체 카테고리</option>
      <option value="차세대">🟦 차세대</option>
      <option value="회원">🟨 회원</option>
      <option value="비회원">🟥 비회원</option>
      <option value="강연자">🎤 강연자</option>
      <option value="미입력">⚠️ 정보 미입력</option>
    </select>
    <span class="count-label" id="countLabel">74명</span>
  </div>

  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>이름</th>
          <th>카테고리</th>
          <th>직업</th>
          <th>소속</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<div class="footer">Korean Professionals Day Brisbane 2026 · World Okta Brisbane</div>

<script src="professionals_day.js"></script>
</body>
</html>
